<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Děkujeme — Cigar Club Žertovo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;
    font-family:'Inter',system-ui,sans-serif;color:#fbf9f5;
    background:radial-gradient(120% 90% at 80% 10%,rgba(28,154,60,.22),transparent 55%),
      radial-gradient(90% 80% at 10% 90%,rgba(224,35,31,.22),transparent 55%),
      linear-gradient(160deg,#211f1c,#2c2825 45%,#1a1815);}
  .card{max-width:540px}
  svg.tree{width:96px;height:110px;margin-bottom:24px}
  h1{font-family:'Playfair Display',serif;font-size:2.4rem;color:#fff;margin-bottom:16px;line-height:1.15}
  p{color:rgba(251,249,245,.82);font-size:1.1rem;line-height:1.6;margin-bottom:14px}
  .em{font-family:'Playfair Display',serif;font-style:italic;color:#8fd6a0}
  a.btn{display:inline-block;margin-top:24px;background:#e0231f;color:#fff;text-decoration:none;
    padding:14px 30px;border-radius:999px;font-weight:600;transition:transform .2s}
  a.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="card">
    <svg class="tree" viewBox="0 0 80 96" aria-hidden="true">
      <circle cx="40" cy="18" r="7.5" fill="#e0231f"/><circle cx="25" cy="24" r="6.5" fill="#fbf9f5"/><circle cx="55" cy="24" r="6.5" fill="#1c9a3c"/><circle cx="16" cy="37" r="6.5" fill="#e0231f"/><circle cx="32" cy="33" r="6.5" fill="#1c9a3c"/><circle cx="48" cy="33" r="6.5" fill="#e0231f"/><circle cx="64" cy="37" r="6.5" fill="#fbf9f5"/><circle cx="22" cy="48" r="6.5" fill="#1c9a3c"/><circle cx="40" cy="45" r="7" fill="#fbf9f5"/><circle cx="58" cy="48" r="6.5" fill="#e0231f"/><circle cx="33" cy="58" r="6" fill="#1c9a3c"/><circle cx="48" cy="58" r="6" fill="#1c9a3c"/><rect x="37" y="60" width="6" height="30" rx="2.5" fill="#fbf9f5"/>
    </svg>
    <h1>Žádost přijata.</h1>
    <p>Děkujeme, že jste oslovili <span class="em">Cigar Club Žertovo</span>. Vaše údaje máme a brzy se vám ozveme e-mailem.</p>
    <p>Oheň už hoří. Uvidíme se u něj.</p>
    <a class="btn" href="cs.html">← Zpět do klubu</a>
  </div>
</body>
</html>
